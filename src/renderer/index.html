<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Just Slip</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: rgba(30, 30, 30, 0.92);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .container {
      text-align: center;
      padding: 24px;
      -webkit-app-region: no-drag;
    }

    .logo {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.35);
    }

    .title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      opacity: 0.85;
      text-transform: uppercase;
    }

    .brightness-display {
      font-size: 42px;
      font-weight: 200;
      margin-bottom: 4px;
      letter-spacing: -1px;
    }

    .brightness-label {
      font-size: 11px;
      opacity: 0.45;
      margin-bottom: 18px;
      letter-spacing: 0.3px;
    }

    .progress-bar {
      width: 150px;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      border-radius: 2px;
      transition: width 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hint {
      font-size: 10px;
      opacity: 0.35;
      line-height: 1.6;
    }

    .hint kbd {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 5px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 9px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .pulse { animation: pulse 0.18s ease; }

    .swipe-indicator {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
      pointer-events: none;
    }

    .swipe-indicator.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="swipe-indicator" id="swipeIndicator"></div>
  <div class="container">
    <div class="logo">☀️</div>
    <div class="title">Just Slip</div>
    <div class="brightness-display" id="brightnessValue">50%</div>
    <div class="brightness-label">Screen Brightness</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 50%"></div>
    </div>
    <div class="hint">
      Swipe ↑↓ on trackpad &nbsp;or&nbsp; <kbd>⌃</kbd><kbd>⌥</kbd><kbd>↑↓</kbd>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
